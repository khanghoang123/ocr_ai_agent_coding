name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches:
      - develop
      - "feature/**"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Lint (ruff)
        run: ruff check src app tests frontend

      - name: Fast test suite
        run: pytest tests/test_pipeline.py tests/test_api_integration.py tests/test_frontend_smoke.py tests/test_ocr_validation_harness.py

      - name: API smoke checks
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from app.main import app
          paths = {route.path for route in app.routes}
          required = {"/health", "/ocr", "/ocr/export"}
          missing = required - paths
          if missing:
              raise SystemExit(f"Missing API routes: {sorted(missing)}")
          print("API smoke passed")
          PY

      - name: Frontend syntax smoke
        run: python -m compileall frontend
