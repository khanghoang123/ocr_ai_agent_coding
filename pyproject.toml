[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "vn-handwritten-ocr"
version = "1.0.0"
description = "Production OCR system for Vietnamese handwritten text recognition"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
  "slow: runs real OCR models / long-running regression",
]

[tool.ruff]
line-length = 100
target-version = "py39"
